name: site-scrape

# Fetch licence details from the public licence-check website (no api.nsw quota):
# hourly until every licence has a full details record, then self-disable.
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      run_seconds:
        description: 'Seconds to spend fetching this run (default 3000 = 50 min)'
        default: '3000'
        required: false
      rate:
        description: 'Requests per second cap (the 180-per-10-minute window is the real limit)'
        default: '0.5'
        required: false
      limit:
        description: 'Stop after N licences (0 = all)'
        default: '0'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: site-scrape
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUN_SECONDS: ${{ inputs.run_seconds || '3000' }}
      RATE: ${{ inputs.rate || '0.5' }}
      LIMIT: ${{ inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Count licences still to fetch
        id: before
        run: echo "left=$(python3 -c "import scrape_site as s; print(len(s.todo_licences(0, 'details')))")" >> "$GITHUB_OUTPUT"

      - name: Fetch details from the site (resumable, checkpoint commits)
        run: |
          [ -f data/site_config.json ] || { echo "data/site_config.json missing: run site-scrape-test (discover) first"; exit 1; }
          python3 scrape_site.py fetch --mode details --rate "$RATE" --limit "$LIMIT" --run-seconds "$RUN_SECONDS" --checkpoint 300 --window-max 180 --window-seconds 600

      - name: Build
        if: always()
        run: python3 pipeline.py build

      - name: Commit and push data/
        if: always()
        run: |
          python3 pipeline.py commit -m "site-scrape run ${{ github.run_number }}"

      # GitHub fires `schedule` unreliably on quiet repos (once in 8 hours here), so each run starts
      # the next one itself.  It only does so if this run made progress, so a blocked site cannot
      # cause an endless chain; the hourly cron remains as the fallback that restarts the chain.
      - name: Start the next run, or disable when nothing is left
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.before.outputs.left }}
        run: |
          left=$(python3 -c "import scrape_site as s; print(len(s.todo_licences(0, 'details')))")
          echo "licences still without full details: $left (was ${BEFORE:-?})"
          wf="${GITHUB_WORKFLOW_REF#*/.github/workflows/}"; wf="${wf%@*}"
          if [ "$left" = "0" ]; then
            echo "nothing left -> disabling $wf"
            gh workflow disable "$wf" --repo "$GITHUB_REPOSITORY"
          elif [ -n "$BEFORE" ] && [ "$left" -lt "$BEFORE" ]; then
            echo "progress made -> starting the next run now"
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f run_seconds="$RUN_SECONDS" -f rate="$RATE" -f limit="$LIMIT"
          else
            echo "no progress this run -> not chaining; the hourly cron will retry"
          fi
